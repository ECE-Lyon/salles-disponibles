# Lancement manuel (Actions > Installateurs > Run workflow) : crée les installateurs à télécharger depuis l'exécution.
# Envoi d'un tag v* (ex. v1.0.1) : crée aussi la release publique utilisée par la page de téléchargement.
name: Installateurs
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  construire:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            commande: dist:win
            nom: installateur-windows
            fichiers: dist/*.exe
          - os: macos-latest
            commande: dist:mac
            nom: installateur-mac
            fichiers: dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reprendre le numéro de version du tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm install
      - run: npm run ${{ matrix.commande }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nom }}
          path: ${{ matrix.fichiers }}
          if-no-files-found: error

  publier:
    # Ne publie que si les deux installateurs ont été créés.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: construire
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: fichiers
      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" fichiers/*/* --repo "$GITHUB_REPOSITORY" --title "Salles Citadelle $GITHUB_REF_NAME" --generate-notes
