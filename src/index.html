<title>Salles Citadelle</title>

<style>
/* Grande fenêtre : une seule vue sans défilement, 2 lignes de 3 étages, plan à gauche et tableau 4 h à droite.
   Tout est en rem et la racine suit la taille de la fenêtre.
   Fenêtre plus petite : le texte garde une taille lisible, les étages passent sur 2 colonnes ou 1 et la page défile. */
:root {
  color-scheme: dark;
  --ink: #170b26;
  --trait: #3a2b52;
  --texte: #f4f2fb;
  --doux: #aca8c6;
  --violet: #8d4bc0;

  --dalle: #eeecf6;
  --dalle-flanc: #8078ad;
  --dalle-flanc-sombre: #5b5286;
  --ombre: #0b0414;
  --local: #dfdded;
  --atrium: #c3bfd9;
  --plan-texte: #6f6a90;

  --libre: #0f8f5c;
  --libre-texte: #55dea2;
  --occupe: #d62f3b;
  --occupe-texte: #ff8089;
  --neutre: #8b88a6;
  --neutre-piste: #2b2040;

  --titre: "Barlow Semi Condensed", "DIN Alternate", "Arial Narrow", sans-serif;
  --corps: "Barlow", "Segoe UI", Arial, sans-serif;
  font-size: min(calc(100vw / 120), calc(100vh / 67.5));
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--texte);
  font-family: var(--corps);
  font-size: 1rem;
  font-variant-numeric: tabular-nums;
  overflow: hidden;
}
.ecran {
  height: 100%;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: .7rem .45rem;
  gap: .5rem;
}

/* En-tête */
.entete { display: flex; align-items: center; gap: 2.25rem; padding-bottom: .55rem; border-bottom: 1px solid var(--trait); }
.signature { display: flex; align-items: center; gap: .7rem; flex: none; padding-right: 2.25rem; border-right: 1px solid var(--trait); align-self: stretch; }
.signature svg { display: block; width: auto; }
.signature .logo-omnes { height: 2.55rem; }
.marque { font: 700 1.9rem/1 var(--titre); letter-spacing: .01em; white-space: nowrap; }
.marque small { display: block; font: 500 .85rem/1.2 var(--corps); color: var(--doux); margin-top: .2rem; letter-spacing: 0; }
.bilan { display: flex; align-items: baseline; gap: 1.5rem; }
.bilan div { display: flex; align-items: baseline; gap: .45rem; font-weight: 600; font-size: 1.05rem; color: var(--doux); }
.bilan b { font: 700 2.5rem/1 var(--titre); }
.bilan .l b { color: var(--libre-texte); }
.bilan .o b { color: var(--occupe-texte); }
.creneau { font-weight: 600; font-size: 1.05rem; padding: .35rem .8rem; border: 1px solid var(--trait); border-radius: .35rem; white-space: nowrap; }
.alerte { font-weight: 600; font-size: .95rem; color: #ffd27a; min-width: 0; }
.demo { font-weight: 700; font-size: .85rem; background: #ffd27a; color: var(--ink); padding: .25rem .6rem; border-radius: .25rem; white-space: nowrap; }
.heure { margin-left: auto; text-align: right; white-space: nowrap; }
.heure b { display: block; font: 700 2.7rem/1 var(--titre); }
.heure span { font-size: .85rem; color: var(--doux); }

/* Grille des étages */
.etages { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); min-height: 0; }
.etage { display: grid; grid-template-columns: minmax(0, 1fr) 16.5rem; gap: .6rem; min-height: 0; min-width: 0; padding: .35rem .9rem .35rem .9rem; }
.etage:nth-child(3n+1) { padding-left: 0; }
.etage:nth-child(3n) { padding-right: 0; }
.etage:not(:nth-child(3n)) { border-right: 1px solid var(--trait); }
.etage:nth-child(-n+3) { border-bottom: 1px solid var(--trait); }
.vue { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; min-width: 0; }
.vue h2 { margin: 0; font: 700 1.5rem/1.1 var(--titre); text-wrap: balance; }
.vue h2 span { font: 600 .95rem/1 var(--corps); color: var(--doux); margin-left: .45rem; }
.vue h2 em { font-style: normal; color: var(--libre-texte); }
.vue svg { width: 100%; height: 100%; display: block; min-height: 0; }

/* Plan 3D */
.p-ombre { fill: var(--ombre); opacity: .6; }
.p-flanc { fill: var(--dalle-flanc); }
.p-flanc.s { fill: var(--dalle-flanc-sombre); }
.p-dalle { fill: var(--dalle); }
.p-local { fill: var(--local); }
.p-atrium { fill: var(--atrium); }
.p-note { fill: var(--plan-texte); font: 600 28px var(--corps); text-anchor: middle; }
.salle .fond { transition: fill .6s; }
.salle.libre .fond { fill: var(--libre); }
.salle.occupee .fond { fill: var(--occupe); }
.salle.ferme .fond, .salle.inconnu .fond { fill: var(--neutre); }
.salle .hachure { fill: url(#hachures); opacity: 0; }
.salle.occupee .hachure { opacity: 1; }
.salle text { fill: #fff; text-anchor: middle; font-family: var(--titre); pointer-events: none; }
.salle .num { font-size: 40px; font-weight: 700; }
.salle .fin { font-size: 34px; font-weight: 600; }

/* Tableau 4 h */
.tableau { width: 100%; border-collapse: collapse; align-self: start; display: block; }
.tableau thead, .tableau tbody { display: block; }
.tableau tr { display: grid; grid-template-columns: minmax(min-content, 1fr) auto; column-gap: .5rem; align-items: baseline; }
.tableau th, .tableau td { display: block; padding: 0; font-weight: inherit; text-align: left; }
.tableau thead th { grid-column: 1 / -1; font-size: .8rem; color: var(--doux); font-weight: 600; height: 1.45rem; }
.axe { position: relative; display: block; height: 1.3rem; }
.axe i { position: absolute; bottom: .15rem; font-style: normal; transform: translateX(-50%); white-space: nowrap; }
.axe i.bord { transform: none; }
.tableau tbody tr { border-top: 1px solid var(--trait); padding-block: .38rem .55rem; row-gap: .22rem; }
.tableau .nom { display: flex; align-items: baseline; gap: .3rem; min-width: 0; white-space: nowrap; }
.nom strong { flex: none; font-weight: 700; font-size: 1.05rem; line-height: 1.15; }
.nom small { flex: 1 1 0; width: 0; overflow: hidden; font-weight: 500; font-size: .85rem; color: var(--doux); }
.tableau .statut { font: 600 1rem/1.15 var(--titre); text-align: right; white-space: nowrap; }
.statut.libre { color: var(--libre-texte); }
.statut.occupee { color: var(--occupe-texte); }
.statut.ferme, .statut.inconnu { color: var(--doux); }
.tableau .c-piste { grid-column: 1 / -1; }
.piste { position: relative; display: block; height: 1.3rem; background: var(--neutre-piste); overflow: hidden; border-radius: .15rem; }
.piste b { position: absolute; top: 0; bottom: 0; }
.piste b.libre { background: var(--libre); }
.piste b.occupee { background: repeating-linear-gradient(135deg, var(--occupe) 0 .3rem, #b32530 .3rem .6rem); }
.piste b.ferme { background: var(--neutre-piste); }
.piste u { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--ink); opacity: .55; }

/* Légende */
.legende { display: flex; flex-wrap: wrap; align-items: center; gap: .3rem 1.5rem; font-size: .85rem; color: var(--doux); }
.legende span { display: inline-flex; align-items: center; gap: .4rem; }
.legende i { width: 1.1rem; height: .75rem; border-radius: .1rem; display: inline-block; }
.legende i.l { background: var(--libre); }
.legende i.o { background: repeating-linear-gradient(135deg, var(--occupe) 0 .2rem, #b32530 .2rem .4rem); }
.legende i.f { background: var(--neutre); }
.legende .maj { margin-left: auto; }

/* Fenêtre trop petite pour tout montrer lisiblement : colonnes automatiques et défilement. */
@media (max-width: 1379px), (max-height: 739px), (max-aspect-ratio: 1/1) {
  :root { font-size: 14px; }
  html, body { height: auto; }
  body { overflow: auto; }
  .ecran { height: auto; display: block; padding-block: 0 .6rem; }
  .entete { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--ink); flex-wrap: wrap; gap: .5rem 1.5rem; padding-block: .6rem; }
  .signature { padding-right: 0; border-right: 0; flex-basis: 100%; }
  .etages { grid-template-columns: repeat(auto-fit, minmax(min(100%, 37rem), 1fr)); grid-template-rows: none; column-gap: 1.75rem; }
  .etage, .etage:nth-child(3n+1), .etage:nth-child(3n), .etage:not(:nth-child(3n)) { padding: .9rem 0; border-right: 0; }
  .etage:nth-child(n) { border-bottom: 1px solid var(--trait); }
  .vue svg { height: auto; aspect-ratio: 1.17; }
  .legende { padding-top: .6rem; }
}
@media (max-width: 620px) {
  .etage, .etage:nth-child(3n+1), .etage:nth-child(3n), .etage:not(:nth-child(3n)) { grid-template-columns: minmax(0, 1fr); }
  .heure { margin-left: 0; }
  .legende .maj { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { .salle .fond { transition: none; } }
</style>

/*LOGIQUE-DEBUT*/
const CRENEAUX = [["8h30","10h30"],["10h45","12h45"],["14h00","16h00"],["16h15","18h15"],["18h30","20h30"]];
const PAUSE_MAX = 15;      // un trou de 15 min ou moins entre deux occupations n'est pas une disponibilité
const FENETRE = 240;       // durée du tableau : 4 h

function enMinutes(txt) {
  const m = /(\d{1,2})\s*[h:]\s*(\d{2})?/.exec(String(txt));
  return m ? Number(m[1]) * 60 + Number(m[2] || 0) : null;
}
const DEBUT_JOUR = enMinutes(CRENEAUX[0][0]);
const FIN_JOUR = enMinutes(CRENEAUX[CRENEAUX.length - 1][1]);

function formaterHeure(min) {
  const m = Math.floor(min);
  return `${Math.floor(m / 60)}h${String(m % 60).padStart(2, "0")}`;
}

// Même formatage des noms que dans le script d'origine.
function formaterNomSalle(str) {
  const noParentheses = str.replace(/\(.*?\)/g, "").trim();
  const noEspaces = noParentheses.replace(/\s+/g, "-");
  const noAccents = noEspaces.normalize("NFD").replace(/[̀-ͯ]/g, "");
  return noAccents.replace(/[^a-zA-Z0-9]+/g, "-");
}

// Clé de comparaison : "Cita-303 B (M) (40)", "Cita-303-B" et "Cita-303B" désignent la même salle.
function cleSalle(nom) {
  return formaterNomSalle(nom).replace(/-/g, "").toLowerCase();
}

// Occupations d'une salle : triées, fusionnées, avec les pauses courtes absorbées.
function fusionnerOccupations(intervalles) {
  const tries = intervalles.filter(i => i.fin > i.deb).sort((a, b) => a.deb - b.deb);
  const res = [];
  for (const i of tries) {
    const der = res[res.length - 1];
    if (der && i.deb - der.fin <= PAUSE_MAX) der.fin = Math.max(der.fin, i.fin);
    else res.push({ deb: i.deb, fin: i.fin });
  }
  // Un cours qui finit juste avant la fin de journée ne libère pas la salle pour 15 min.
  const der = res[res.length - 1];
  if (der && der.fin < FIN_JOUR && FIN_JOUR - der.fin <= PAUSE_MAX) der.fin = FIN_JOUR;
  return res;
}

function occupationsParSalle(listeCours) {
  const parSalle = {};
  for (const cours of listeCours || []) {
    const deb = enMinutes(cours.deb), fin = enMinutes(cours.fin);
    if (deb === null || fin === null) continue;
    for (const nom of cours.sal || []) {
      (parSalle[cleSalle(nom)] ||= []).push({ deb, fin });
    }
  }
  for (const cle in parSalle) parSalle[cle] = fusionnerOccupations(parSalle[cle]);
  return parSalle;
}

function etatSalle(occupations, maintenant) {
  for (const o of occupations) if (maintenant >= o.deb && maintenant < o.fin) return { etat: "occupee", jusqua: o.fin };
  if (maintenant >= FIN_JOUR) return { etat: "ferme" };
  const suivante = occupations.find(o => o.deb > maintenant);
  return { etat: "libre", jusqua: suivante ? Math.min(suivante.deb, FIN_JOUR) : FIN_JOUR };
}

// Segments de la fenêtre [maintenant, maintenant + 4 h], exprimés en minutes.
function segmentsFenetre(occupations, maintenant) {
  const fin = maintenant + FENETRE, segs = [];
  let t = maintenant;
  const ajoute = (a, b, etat) => { if (b > a) segs.push({ deb: a, fin: b, etat }); };
  const libreJusqua = (a, b) => {
    ajoute(a, Math.min(b, FIN_JOUR), "libre");
    ajoute(Math.max(a, FIN_JOUR), b, "ferme");
  };
  for (const o of occupations) {
    if (o.fin <= t) continue;
    if (o.deb >= fin) break;
    if (o.deb > t) libreJusqua(t, o.deb);
    ajoute(Math.max(o.deb, t), Math.min(o.fin, fin), "occupee");
    t = o.fin;
    if (t >= fin) break;
  }
  if (t < fin) libreJusqua(t, fin);
  return segs;
}

function libelleCreneau(maintenant) {
  if (maintenant < DEBUT_JOUR) return `Premiers cours à ${CRENEAUX[0][0]}`;
  if (maintenant >= FIN_JOUR) return "Cours terminés pour aujourd'hui";
  for (let i = 0; i < CRENEAUX.length; i++) {
    const [d, f] = CRENEAUX[i];
    if (maintenant >= enMinutes(d) && maintenant < enMinutes(f)) return `Cours ${d} – ${f}`;
    const suivant = CRENEAUX[i + 1];
    if (suivant && maintenant >= enMinutes(f) && maintenant < enMinutes(suivant[0]))
      return `${enMinutes(suivant[0]) - enMinutes(f) > PAUSE_MAX ? "Pause déjeuner" : "Pause"} jusqu'à ${suivant[0]}`;
  }
  return "";
}
/*LOGIQUE-FIN*/

const ETAGES = [
  { titre: "Rez-de-chaussée", salles: [["Cita-Amphi1-Fourviere","Amphi 1","Fourvière","Amphi 1"],["Cita-Amphi2-Tete-d-Or","Amphi 2","Tête d'Or","Amphi 2"]] },
  { titre: "1er étage", salles: [["Cita-101","Salle 101","","101"],["Cita-102","Salle 102","","102"],["Cita-103","Salle 103","","103"],["Cita-104","Salle 104","","104"],["Cita-105","Salle 105","","105"],["Cita-Labo-1","Labo 1","ECE","Labo 1"],["Cita-Labo-2","Labo 2","ECE","Labo 2"]] },
  { titre: "2e étage", salles: [["Cita-201","Salle 201","","201"],["Cita-202","Salle 202","","202"],["Cita-203A","Salle 203-A","","203-A"],["Cita-203B","Salle 203-B","","203-B"]] },
  { titre: "3e étage", salles: [["Cita-301-Info-Chariot","Salle 301","Windows","301"],["Cita-302-Info-MAC","Salle 302","MacOS","302"],["Cita-303A","Salle 303-A","","303-A"],["Cita-303B","Salle 303-B","","303-B"]] },
  { titre: "4e étage", salles: [401,402,403,404,405,406].map(n => [`Cita-${n}`,`Salle ${n}`,"",String(n)]) },
  { titre: "5e étage", salles: [501,502,503,504,505,506,507].map(n => [`Cita-${n}`,`Salle ${n}`,"",String(n)]) },
];
const TOUTES = ETAGES.flatMap(e => e.salles.map(s => cleSalle(s[0])));

/* ---------- Projection : le sol est tourné puis écrasé, seul un chant de dalle donne le relief ---------- */
const ANGLE = -14 * Math.PI / 180, ECRASE = .84, EPAISSEUR = 34;
const cA = Math.cos(ANGLE), sA = Math.sin(ANGLE);
const proj = ([x, y]) => { const dx = x - 720, dy = y - 450; return [dx * cA - dy * sA, (dx * sA + dy * cA) * ECRASE]; };
const pts = p => p.map(q => q.map(v => v.toFixed(1)).join(",")).join(" ");
const surface = p => { let a = 0; p.forEach((q, i) => { const r = p[(i + 1) % p.length]; a += q[0] * r[1] - r[0] * q[1]; }); return a / 2; };
function centroide(p) {
  let a = 0, cx = 0, cy = 0;
  p.forEach((q, i) => { const r = p[(i + 1) % p.length], f = q[0] * r[1] - r[0] * q[1]; a += f; cx += (q[0] + r[0]) * f; cy += (q[1] + r[1]) * f; });
  return [cx / (3 * a), cy / (3 * a)];
}
const contient = (p, [x, y]) => { let d = false; for (let i = 0, j = p.length - 1; i < p.length; j = i++) { if ((p[i][1] > y) !== (p[j][1] > y) && x < (p[j][0] - p[i][0]) * (y - p[i][1]) / (p[j][1] - p[i][1]) + p[i][0]) d = !d; } return d; };

const toutes = PLANS.flatMap(f => f.slab.map(proj));
const OMBRE = [16, 40];
const vb = (() => {
  const xs = toutes.map(p => p[0]), ys = toutes.map(p => p[1]);
  const x0 = Math.min(...xs) - 10, x1 = Math.max(...xs) + OMBRE[0] + 10, y0 = Math.min(...ys) - 10, y1 = Math.max(...ys) + EPAISSEUR + OMBRE[1] + 6;
  return `${x0.toFixed(0)} ${y0.toFixed(0)} ${(x1 - x0).toFixed(0)} ${(y1 - y0).toFixed(0)}`;
})();

function svgPlan(plan, etage, index) {
  const dalle = plan.slab.map(proj), sens = Math.sign(surface(dalle));
  const flancs = [];
  dalle.forEach((a, i) => {
    const b = dalle[(i + 1) % dalle.length];
    const nx = (b[1] - a[1]) * sens, ny = -(b[0] - a[0]) * sens;
    if (ny <= 0) return;
    flancs.push({ y: (a[1] + b[1]) / 2, s: nx > 0, q: [a, b, [b[0], b[1] + EPAISSEUR], [a[0], a[1] + EPAISSEUR]] });
  });
  flancs.sort((u, v) => u.y - v.y);
  const ombre = dalle.map(p => [p[0] + OMBRE[0], p[1] + EPAISSEUR + OMBRE[1] * .6]);
  let h = `<polygon class="p-ombre" points="${pts(ombre)}"/>`;
  h += flancs.map(f => `<polygon class="p-flanc${f.s ? " s" : ""}" points="${pts(f.q)}"/>`).join("");
  h += `<polygon class="p-dalle" points="${pts(dalle)}"/>`;
  for (const t of plan.tiles) {
    const atrium = index > 0 && contient(t, [975, 455]);
    h += `<polygon class="${atrium ? "p-atrium" : "p-local"}" points="${pts(t.map(proj))}"/>`;
    if (atrium) { const c = proj([975, 455]); h += `<text class="p-note" x="${c[0].toFixed(1)}" y="${(c[1] + 10).toFixed(1)}">Atrium</text>`; }
  }
  if (index === 0) { const c = proj([767, 175]); h += `<text class="p-note" x="${c[0].toFixed(1)}" y="${c[1].toFixed(1)}">Entrée</text>`; }
  for (const r of plan.rooms) {
    const s = etage.salles.find(x => x[0] === r.id), proj2 = r.poly.map(proj), c = proj(r.c);
    h += `<g class="salle inconnu" id="plan-${r.id}"><polygon class="fond" points="${pts(proj2)}"/><polygon class="hachure" points="${pts(proj2)}"/>`
      + `<text class="num" x="${c[0].toFixed(1)}" y="${(c[1] - 2).toFixed(1)}">${s[3]}</text>`
      + `<text class="fin" x="${c[0].toFixed(1)}" y="${(c[1] + 33).toFixed(1)}"></text></g>`;
  }
  return `<svg viewBox="${vb}" role="img" aria-label="Plan du ${etage.titre}">${h}</svg>`;
}

/* ---------- Construction de l'écran ---------- */
const racine = document.getElementById("etages");
racine.innerHTML = ETAGES.map((e, i) => `
  <section class="etage">
    <div class="vue">
      <h2>${e.titre}<span id="bilan-${i}"></span></h2>
      ${svgPlan(PLANS[i], e, i)}
    </div>
    <table class="tableau">
      <thead><tr><th scope="col"><span class="axe" data-axe></span></th></tr></thead>
      <tbody>${e.salles.map(s => `<tr><th scope="row" class="nom"><strong>${s[1].replace("Salle ", "")}</strong>${s[2] ? `<small>${s[2]}</small>` : ""}</th><td class="statut inconnu" id="statut-${s[0]}">…</td><td class="c-piste"><span class="piste" id="piste-${s[0]}"></span></td></tr>`).join("")}</tbody>
    </table>
  </section>`).join("")
  + `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><pattern id="hachures" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="26" fill="#000" fill-opacity=".16"/></pattern></defs></svg>`;

/* ---------- Horloge : on suit l'heure donnée par le planning, l'écran peut avoir une horloge fausse ---------- */
const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const JOURS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const DEMO = DEMO_FORCE || location.hash === "#demo" || !window.citadelle;
const PERIME_MS = 5 * 60 * 1000, RAFRAICHIR_MS = 60 * 1000;
const etatPage = { occupations: null, ancre: null, majOk: 0, erreur: null, jour: "" };

function lireDate(v) {
  const m = /(\d{2})\/(\d{2})\/(\d{4})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?/.exec(v || "");
  if (!m) return null;
  const d = new Date(+m[3], +m[2] - 1, +m[1]);
  return { minutes: +m[4] * 60 + +m[5] + (+m[6] || 0) / 60, jour: `${JOURS[d.getDay()]} ${+m[1]} ${MOIS[+m[2] - 1]} ${m[3]}` };
}
function heureLocale() {
  const d = new Date();
  return { minutes: d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60, jour: `${JOURS[d.getDay()]} ${d.getDate()} ${MOIS[d.getMonth()]} ${d.getFullYear()}` };
}
function maintenant() {
  if (!etatPage.ancre) return heureLocale().minutes;
  return etatPage.ancre.minutes + (Date.now() - etatPage.ancre.t) / 60000;
}

function appliquerDonnees(data) {
  const h = lireDate(data?.parametres?.date?.V) || heureLocale();
  etatPage.ancre = { minutes: h.minutes, t: Date.now() };
  etatPage.jour = h.jour;
  etatPage.occupations = occupationsParSalle(data.listeCours);
  etatPage.majOk = Date.now();
  etatPage.erreur = null;
  // Une salle du campus non reconnue s'afficherait libre à tort : on le signale à l'écran.
  const noms = [...new Set((data.listeCours || []).flatMap(c => c.sal || []))];
  const inconnus = noms.filter(n => !TOUTES.includes(cleSalle(n)));
  if (inconnus.length) console.warn("Salles du planning absentes de la liste :", inconnus);
  etatPage.sallesInconnues = inconnus.filter(n => /^cita/i.test(n)).map(n => n.replace(/\(.*?\)/g, "").trim());
}

async function charger() {
  try {
    appliquerDonnees(await window.citadelle.lirePlanning());
  } catch (e) {
    etatPage.erreur = e.message;
  }
  dessiner();
}

/* ---------- Rendu ---------- */
function dessiner() {
  const now = maintenant();
  const frais = etatPage.occupations && (DEMO || Date.now() - etatPage.majOk < PERIME_MS);
  let libres = 0, occupees = 0;

  ETAGES.forEach((e, i) => {
    let libresEtage = 0;
    e.salles.forEach(([id]) => {
      const occ = frais ? (etatPage.occupations[cleSalle(id)] || []) : null;
      const st = occ ? etatSalle(occ, now) : { etat: "inconnu" };
      if (st.etat === "libre") { libres++; libresEtage++; }
      if (st.etat === "occupee") occupees++;

      const g = document.getElementById("plan-" + id);
      g.setAttribute("class", "salle " + st.etat);
      g.querySelector(".fin").textContent = st.jusqua != null ? `→${formaterHeure(st.jusqua)}` : "";

      const statut = document.getElementById("statut-" + id);
      statut.className = "statut " + st.etat;
      statut.textContent = st.etat === "libre" ? `Libre jusqu'à ${formaterHeure(st.jusqua)}`
        : st.etat === "occupee" ? `Occupée jusqu'à ${formaterHeure(st.jusqua)}`
        : st.etat === "ferme" ? "Cours terminés" : "Indisponible";

      const piste = document.getElementById("piste-" + id);
      const hachesHeures = heuresPleines(now).map(m => `<u style="left:${((m - now) / FENETRE * 100).toFixed(2)}%"></u>`).join("");
      piste.innerHTML = occ
        ? segmentsFenetre(occ, now).map(s => `<b class="${s.etat}" style="left:${((s.deb - now) / FENETRE * 100).toFixed(2)}%;width:${((s.fin - s.deb) / FENETRE * 100).toFixed(2)}%"></b>`).join("") + hachesHeures
        : hachesHeures;
    });
    document.getElementById("bilan-" + i).innerHTML = frais ? `<em>${libresEtage}</em> / ${e.salles.length} libres` : "";
  });

  document.querySelectorAll("[data-axe]").forEach(a => {
    a.innerHTML = `<i class="bord" style="left:0">${formaterHeure(now)}</i>` + heuresPleines(now)
      .filter(m => (m - now) / FENETRE > .17 && (m - now) / FENETRE < .95)
      .map(m => `<i style="left:${((m - now) / FENETRE * 100).toFixed(2)}%">${m / 60 % 24}h</i>`).join("");
  });

  document.getElementById("nb-libres").textContent = frais ? libres : "–";
  document.getElementById("nb-occupees").textContent = frais ? occupees : "–";
  document.getElementById("heure").textContent = formaterHeure(now);
  document.getElementById("date").textContent = etatPage.jour || heureLocale().jour;
  document.getElementById("creneau").textContent = libelleCreneau(now);
  document.getElementById("demo").hidden = !DEMO;

  const alerte = document.getElementById("alerte");
  const message = !etatPage.occupations ? (etatPage.erreur ? "Planning injoignable. Vérifiez la connexion : nouvel essai dans une minute." : "")
    : !frais ? "Planning injoignable depuis plus de 5 minutes : disponibilités masquées."
    : etatPage.erreur ? "Planning injoignable : dernières données connues affichées."
    : etatPage.sallesInconnues?.length ? `Salle du planning non reconnue, à vérifier : ${etatPage.sallesInconnues.slice(0, 3).join(", ")}${etatPage.sallesInconnues.length > 3 ? "…" : ""}`
    : "";
  alerte.textContent = message;
  alerte.hidden = !message;

  document.getElementById("maj").textContent = DEMO ? "" : etatPage.majOk
    ? `Planning relu à ${new Date(etatPage.majOk).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }).replace(":", "h")}, actualisé chaque minute` : "";
}
function heuresPleines(now) {
  const res = [];
  for (let m = Math.ceil(now / 60 + 1e-6) * 60; m < now + FENETRE; m += 60) res.push(m);
  return res;
}

/* ---------- Démarrage ---------- */
function donneesDemo() {
  const c = [
    ["8h30","10h30",["Cita-Amphi1-Fourvière (300)","Cita-101","Cita-102","Cita-104","Cita-105","Cita-303A","Cita-406","Cita-Labo-1 (ECE)","Cita-201","Cita-203A","Cita-301-Info Chariot","Cita-401","Cita-403","Cita-501","Cita-505"]],
    ["10h45","12h45",["Cita-Amphi1-Fourvière (300)","Cita-101","Cita-103","Cita-105","Cita-303A","Cita-406","Cita-201","Cita-Labo-1 (ECE)","Cita-202","Cita-203A","Cita-302-Info-MAC","Cita-401","Cita-404","Cita-502","Cita-505","Cita-507"]],
    ["14h00","16h00",["Cita-Amphi2-Tête-d'Or","Cita-102","Cita-104","Cita-105","Cita-Labo-2","Cita-201","Cita-303A","Cita-402","Cita-405","Cita-503","Cita-506"]],
    ["16h15","18h15",["Cita-101","Cita-105","Cita-203B","Cita-303B","Cita-402","Cita-406","Cita-503","Cita-504"]],
  ];
  return { parametres: { date: { V: "05/11/2026 10:38:00" } }, listeCours: c.map(([deb, fin, sal]) => ({ deb, fin, sal })) };
}

dessiner();
if (DEMO) { appliquerDonnees(donneesDemo()); dessiner(); }
else {
  charger();
  setInterval(charger, RAFRAICHIR_MS);
  // Au réveil de l'ordinateur ou au retour du réseau, on relit tout de suite le planning.
  window.citadelle.surActualisation(charger);
  window.addEventListener("online", charger);
}
setInterval(dessiner, 15000);
</script>
